name: Apply global ACP forced config

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-global-forced-config.yml"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - name: Apply global forced-config patch
        run: python3 .github/scripts/apply_global_forced_config.py

      - name: Format and static diff checks
        run: |
          cargo fmt
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          git diff --check
          grep -n 'default_acp_forced_config' crates/webcodex-runner/src/webcodex_runner/config.rs
          grep -n 'effective_provider_config' crates/webcodex-runner/src/webcodex_runner/coding_agent.rs
          grep -n 'Global ACP Settings' apps/desktop/src/features/extensions/CodingAgentGlobalSettingsEditor.tsx
          grep -n 'gpt-6-luna' deploy/webcodex-runner.toml.example

      - name: Install Linux Desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Test Runner global forced config
        run: |
          cargo check --locked -p webcodex-runner
          cargo test --locked -p webcodex-runner forced_config
          cargo test --locked -p webcodex-runner global_forced_config

      - name: Test Desktop backend
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml coding_agents
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml acp_reconcile

      - name: Test Desktop frontend
        run: |
          npm ci --prefix frontend
          npm ci --prefix apps/desktop
          npm run typecheck --prefix apps/desktop
          npm test --prefix apps/desktop

      - name: Publish tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-global-forced-config.yml
          rm -f .github/scripts/apply_global_forced_config.py
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git commit -m "feat(acp): enforce GPT-6 Luna max globally [release-now]"
          git push origin HEAD:main

