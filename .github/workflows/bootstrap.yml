name: Bootstrap full WebCodex source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tested forced_config patch
        run: |
          cp bootstrap/forced-config.patch /tmp/forced-config.patch
          test "$(wc -c < /tmp/forced-config.patch)" -eq 41073
          echo "17f475f6c4d340ace7a6b6895efe46e3e83ea177f0e24f4f2846a0672e7529bb  /tmp/forced-config.patch" | sha256sum -c -

      - name: Materialize upstream baseline
        env:
          UPSTREAM_SHA: 2d2274f430b438dba080982fc50ba77ba866a879
        run: |
          git remote add upstream https://github.com/yyjeqhc/webcodex.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          git checkout -B main "$UPSTREAM_SHA"

      - name: Preserve bootstrap workflow only
        run: |
          git show origin/main:.github/workflows/bootstrap.yml > /tmp/bootstrap.yml
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml

      - name: Apply forced_config patch
        run: |
          git apply --check /tmp/forced-config.patch
          git apply /tmp/forced-config.patch
          git diff --check

      - name: Format and verify focused tests
        run: |
          cargo fmt
          cargo fmt --check
          cargo test -p webcodex-runner forced_config

      - name: Commit full fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(runner): add Runner-owned ACP forced_config"
          git push --force origin main

# exact-patch-retry
