name: Integrate upstream and build Luna 6 Windows

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-upstream-luna6.yml"

permissions:
  contents: write

jobs:
  integrate:
    name: Merge upstream + forced GPT-6 Luna
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.publish.outputs.commit }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest upstream and preserve forced_config
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          OURS="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/yyjeqhc/webcodex.git
          git fetch --no-tags upstream main
          UPSTREAM="$(git rev-parse FETCH_HEAD)"
          BASE="$(git merge-base "$OURS" "$UPSTREAM")"

          echo "fork=$OURS"
          echo "upstream=$UPSTREAM"
          echo "base=$BASE"

          mkdir -p /tmp/webcodex-merge
          git show "$UPSTREAM:crates/webcodex-runner/src/webcodex_runner/config.rs" > /tmp/webcodex-merge/upstream-config.rs
          git show "$BASE:crates/webcodex-runner/src/webcodex_runner/config.rs" > /tmp/webcodex-merge/base-config.rs
          git show "$OURS:crates/webcodex-runner/src/webcodex_runner/config.rs" > /tmp/webcodex-merge/fork-config.rs
          git show "$OURS:.github/workflows/desktop-build.yml" > /tmp/webcodex-merge/desktop-build.yml

          git checkout --detach "$UPSTREAM"

          git show "$OURS:crates/webcodex-runner/src/webcodex_runner/coding_agent.rs" > crates/webcodex-runner/src/webcodex_runner/coding_agent.rs
          git show "$OURS:docs/agent/acp-coding-agent-run.md" > docs/agent/acp-coding-agent-run.md
          git show "$OURS:deploy/webcodex-runner.toml.example" > deploy/webcodex-runner.toml.example

          set +e
          git merge-file -p /tmp/webcodex-merge/upstream-config.rs /tmp/webcodex-merge/base-config.rs /tmp/webcodex-merge/fork-config.rs > crates/webcodex-runner/src/webcodex_runner/config.rs
          MERGE_STATUS=$?
          set -e
          if [ "$MERGE_STATUS" -ne 0 ]; then
            echo "config.rs three-way merge reported conflicts"
            grep -n '^<<<<<<<\|^=======\|^>>>>>>>' crates/webcodex-runner/src/webcodex_runner/config.rs || true
            exit 1
          fi

          sed -i 's/gpt-5\.6-luna/gpt-6-luna/g'             crates/webcodex-runner/src/webcodex_runner/coding_agent.rs             crates/webcodex-runner/src/webcodex_runner/config.rs             docs/agent/acp-coding-agent-run.md             deploy/webcodex-runner.toml.example

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/webcodex-merge/desktop-build.yml .github/workflows/desktop-build.yml

          if grep -R -n 'gpt-5\.6-luna'             crates/webcodex-runner/src/webcodex_runner/coding_agent.rs             crates/webcodex-runner/src/webcodex_runner/config.rs             docs/agent/acp-coding-agent-run.md             deploy/webcodex-runner.toml.example; then
            echo "stale gpt-5.6-luna reference remains in forced_config surface"
            exit 1
          fi

          grep -n 'gpt-6-luna'             crates/webcodex-runner/src/webcodex_runner/coding_agent.rs             crates/webcodex-runner/src/webcodex_runner/config.rs             docs/agent/acp-coding-agent-run.md             deploy/webcodex-runner.toml.example

          cargo fmt
          cargo fmt --check
          cargo check --locked -p webcodex-runner
          cargo test --locked -p webcodex-runner forced_config

          git add -A
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' 'merge: upstream main with forced GPT-6 Luna + max [release-now]' | git commit-tree "$TREE" -p "$OURS" -p "$UPSTREAM")"
          git reset --hard "$COMMIT"

          test "$(git rev-list --parents -n 1 "$COMMIT" | wc -w)" -eq 3
          test "$(git rev-parse "$COMMIT^1")" = "$OURS"
          test "$(git rev-parse "$COMMIT^2")" = "$UPSTREAM"

          git push origin "$COMMIT:refs/heads/main" --force-with-lease="refs/heads/main:$OURS"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Published merge commit $COMMIT"

  windows-x64:
    name: Build Windows x64 Desktop
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.commit }}
          fetch-depth: 0

      - name: Verify merge and forced configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parents = (git rev-list --parents -n 1 HEAD).Trim().Split(" ")
          if ($parents.Count -ne 3) { throw "Expected a two-parent merge commit" }

          $paths = @(
            "crates/webcodex-runner/src/webcodex_runner/coding_agent.rs",
            "crates/webcodex-runner/src/webcodex_runner/config.rs",
            "deploy/webcodex-runner.toml.example",
            "docs/agent/acp-coding-agent-run.md"
          )
          foreach ($path in $paths) {
            if (Select-String -Path $path -SimpleMatch "gpt-5.6-luna" -Quiet) {
              throw "Stale gpt-5.6-luna remains in $path"
            }
          }
          if (-not (Select-String -Path "deploy/webcodex-runner.toml.example" -SimpleMatch 'model = "gpt-6-luna"' -Quiet)) {
            throw "gpt-6-luna forced_config example missing"
          }
          if (-not (Select-String -Path "deploy/webcodex-runner.toml.example" -SimpleMatch 'reasoning_effort = "max"' -Quiet)) {
            throw "max reasoning forced_config example missing"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-windows-x64-luna6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Desktop dependencies
        run: npm ci --prefix apps/desktop

      - name: Compile forced_config on Windows
        shell: pwsh
        run: |
          cargo check --locked -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "webcodex-runner cargo check failed" }
          cargo test --locked -p webcodex-runner forced_config
          if ($LASTEXITCODE -ne 0) { throw "forced_config tests failed" }

      - name: Build exact WebCodex runtime
        id: runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = (git rev-parse HEAD).Trim()
          $short = (git rev-parse --short=12 HEAD).Trim()
          $version = (node -e "console.log(require('./npm/webcodex/package.json').version)").Trim()
          $builtAt = [Int64]((git show -s --format=%ct HEAD).Trim())

          $env:WEBCODEX_BUILT_AT = "$builtAt"
          cargo build --locked --profile dogfood -p webcodex -p webcodex-cli -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "WebCodex runtime build failed" }

          foreach ($name in @("webcodex", "webcodex-server", "webcodex-runner")) {
            $binary = Join-Path "target\dogfood" "$name.exe"
            $output = @(& $binary --version)
            if ($LASTEXITCODE -ne 0 -or $output.Count -eq 0) { throw "$name --version failed" }
            $actual = $output[0].TrimEnd()
            $expected = "$name $version (commit $short, dirty=false, built_at=$builtAt)"
            if ($actual -ne $expected) { throw "Unexpected $name identity: $actual" }
          }

          "source=$source" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "built_at=$builtAt" >> $env:GITHUB_OUTPUT

      - name: Stage runtime for Windows Desktop
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "webcodex-desktop-windows-bundle"
          & .\scripts\prepare_desktop_bundle.ps1 `
            -BinDir "target\dogfood" `
            -Version "${{ steps.runtime.outputs.version }}" `
            -SourceSha "${{ steps.runtime.outputs.source }}" `
            -BuiltAt ([Int64]"${{ steps.runtime.outputs.built_at }}") `
            -OutputDir $stage
          "config=$(Join-Path $stage 'tauri.bundle.conf.json')" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        id: installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE "target\desktop-windows-tauri"
          npm exec tauri -- build --bundles nsis --config "${{ steps.bundle.outputs.config }}" --ci --no-sign
          if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS build failed" }

          $bundleDir = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $built = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" -File)
          if ($built.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($built.Count)" }

          $dist = Join-Path $env:GITHUB_WORKSPACE "target\desktop-dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $installer = Join-Path $dist "webcodex-desktop-${{ steps.runtime.outputs.short }}-v${{ steps.runtime.outputs.version }}-gpt6-luna-max-win32-x64-setup.exe"
          Copy-Item -LiteralPath $built[0].FullName -Destination $installer
          "path=$installer" >> $env:GITHUB_OUTPUT

      - name: Smoke Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\desktop_install_windows_smoke.ps1 `
            -Installer "${{ steps.installer.outputs.path }}" `
            -Version "${{ steps.runtime.outputs.version }}" `
            -SourceSha "${{ steps.runtime.outputs.source }}" `
            -BuiltAt ([Int64]"${{ steps.runtime.outputs.built_at }}") `
            -Platform win32-x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: webcodex-desktop-gpt6-luna-max-win32-x64
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14
