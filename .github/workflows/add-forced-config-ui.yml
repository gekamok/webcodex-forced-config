name: Add forced config Desktop UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-forced-config-ui.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Apply Desktop forced_config editor patch
        run: python3 .github/scripts/add_forced_config_ui.py

      - name: Format and verify patch
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo fmt
          git diff --check
          grep -R -n 'gpt-6-luna' apps/desktop/src-tauri/src/coding_agents/tests.rs apps/desktop/src/features/RunnerCapabilities.test.tsx apps/desktop/src/features/extensions/CodingAgentEditor.tsx

      - name: Install Linux dependencies for Desktop backend tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Test Desktop backend
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml coding_agents
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml acp_reconcile

      - name: Test forced_config Runner
        run: |
          cargo check --locked -p webcodex-runner
          cargo test --locked -p webcodex-runner forced_config

      - name: Test Desktop frontend
        run: |
          npm ci --prefix apps/desktop
          npm run typecheck --prefix apps/desktop
          npm test --prefix apps/desktop

      - name: Publish tested UI patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/coding_agents.rs
          git add apps/desktop/src-tauri/src/coding_agents/tests.rs
          git add apps/desktop/src-tauri/src/webcodex/settings/acp.rs
          git add apps/desktop/src/models/runner-capabilities.ts
          git add apps/desktop/src/features/extensions/CodingAgentEditor.tsx
          git add apps/desktop/src/i18n/runner-capabilities.ts
          git add apps/desktop/src/features/RunnerCapabilities.test.tsx
          git commit -m "feat(desktop): manage forced ACP model and effort [release-now]"
          git push origin HEAD:main
